<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2414">
  <title>Wai Hlyan Soe &amp; Jue Mi Mi Aw · Wedding Invitation</title>
  <meta name="description" content="You're invited to our wedding celebration — November 29, 2026, Royal Myeik Hotel.">
  <meta property="og:title" content="Wedding Invitation">
  <meta property="og:description" content="You're invited to our wedding celebration — November 29, 2026.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&family=Noto+Serif+Myanmar:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="../assets/img/en-hero.jpg">
  <link rel="stylesheet" href="style.css?v=39">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="champ" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f5e3bd"/>
        <stop offset=".5" stop-color="#d6b47a"/>
        <stop offset="1" stop-color="#f0dcae"/>
      </linearGradient>
    </defs>
  </svg>

  <main class="app">
    <!-- ================= PAGE 1 : HERO ================= -->
    <section class="page hero" id="hero" aria-label="Wedding invitation">
      <div class="hero-backdrop" aria-hidden="true"></div>
      <div class="stage" id="stage">
        <div class="photo-wrap" id="photoWrap">
          <img class="photo" id="photo" alt="Wai Hlyan Soe and Jue Mi Mi Aw">
        </div>
        <div class="shade" aria-hidden="true"></div>
        <div class="light-leak" aria-hidden="true"></div>

        <!-- thin champagne arch framing the couple -->
        <svg class="arch" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true">
          <path pathLength="1000" d="M1 150 V48 A49 47 0 0 1 99 48 V150" fill="none" stroke="url(#champ)" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
        </svg>

        <canvas class="petals" id="petals" aria-hidden="true"></canvas>

        <!-- white blossom branches in the corners -->
        <img class="flora fl-tl" src="../assets/img/en-fl-tl.png" alt="" aria-hidden="true">
        <img class="flora fl-bl" src="../assets/img/en-fl-bl.png" alt="" aria-hidden="true">
        <img class="flora fl-br" src="../assets/img/en-fl-br.png" alt="" aria-hidden="true">

        <!-- top bar: menu + music -->
        <button class="ic-menu" type="button" aria-label="Menu"><i></i><i></i><i></i></button>

        <div class="content">
          <svg class="rings" viewBox="0 0 160 44" aria-hidden="true">
            <path class="r-line" d="M0 22 H48 M112 22 H160" stroke="url(#champ)" stroke-width=".9"/>
            <circle class="r-ring" cx="70" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.2"/>
            <circle class="r-ring r2" cx="90" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.2"/>
          </svg>
          <p class="kicker" id="kicker"></p>
          <h1 class="title">
            <span class="title-main" id="titleMain"></span>
            <span class="title-script" id="titleScript"></span>
          </h1>
          <svg class="flourish" viewBox="0 0 240 20" aria-hidden="true">
            <path d="M8 10 H92 M148 10 H232" stroke="url(#champ)" stroke-width=".9"/>
            <path d="M120 10 c-6 -7 -15 -7 -17 -1 c-2 6 7 8 11 3 M120 10 c6 -7 15 -7 17 -1 c2 6 -7 8 -11 3 M120 10 c-4 4 -4 6 0 8 c4 -2 4 -4 0 -8 M100 10 c-3 -3 -6 -2 -6 0 M140 10 c3 -3 6 -2 6 0" fill="none" stroke="url(#champ)" stroke-width="1.2"/>
          </svg>
          <p class="names"><span id="groomName"></span><em>&amp;</em><span id="brideName"></span></p>
          <span class="diamond" aria-hidden="true"></span>
          <div class="meta">
            <span class="meta-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.4"/><g fill="currentColor"><circle cx="8" cy="13" r=".9"/><circle cx="12" cy="13" r=".9"/><circle cx="16" cy="13" r=".9"/><circle cx="8" cy="16.5" r=".9"/><circle cx="12" cy="16.5" r=".9"/></g></svg>
              <span id="metaDate"></span>
            </span>
            <span class="meta-sep" aria-hidden="true"></span>
            <span class="meta-item">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <span id="metaVenue"></span>
            </span>
          </div>
          <button class="enter" id="enterBtn" type="button">
            <span class="enter-shine" aria-hidden="true"></span>
            <span class="enter-label" id="enterLabel"></span>
            <svg class="enter-arrow" viewBox="0 0 34 12" aria-hidden="true"><path d="M1 6 H32 M26 1 L32 6 L26 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ================= PAGE 2 : THE GARDEN (hub) ================= -->
    <section class="page garden" id="garden" aria-label="The wedding garden" aria-hidden="true">
      <div class="hero-backdrop garden-backdrop" aria-hidden="true"></div>
      <div class="stage g-stage" id="gStage">
        <div class="g-world" id="gWorld">
          <img class="g-bg" src="../assets/img/en-p2-bg.jpg" alt="" draggable="false">
          <!-- warm lantern / candle flicker -->
          <span class="g-glow gl-1" aria-hidden="true"></span>
          <span class="g-glow gl-2" aria-hidden="true"></span>
          <span class="g-glow gl-3" aria-hidden="true"></span>
          <span class="g-sun" aria-hidden="true"></span>

          <!-- the four sign boards (text is painted on the wood) -->
          <button class="sign s1" type="button" data-dest="story" aria-label="Our Story"><span class="sign-glint"></span></button>
          <button class="sign s2" type="button" data-dest="gallery" aria-label="Gallery"><span class="sign-glint"></span></button>
          <button class="sign s3" type="button" data-dest="bigday" aria-label="The Big Day"><span class="sign-glint"></span></button>
          <button class="sign s4" type="button" data-dest="quiz" aria-label="Fun Quiz"><span class="sign-glint"></span></button>
        </div>
        <div class="g-shade" aria-hidden="true"></div>

        <button class="ic-back" type="button" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 48 24" aria-hidden="true"><path d="M46 12 H3 M12 3 L3 12 L12 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="g-title">
          <svg class="g-rings" viewBox="0 0 160 44" aria-hidden="true">
            <path d="M0 22 H50 M110 22 H160" stroke="url(#champ)" stroke-width="1" vector-effect="non-scaling-stroke"/>
            <circle cx="70" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.4"/>
            <circle cx="90" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.4"/>
          </svg>
          <p class="g-script" id="gScript"></p>
          <p class="g-names"><span id="gGroom"></span><em>&amp;</em><span id="gBride"></span></p>
          <svg class="g-divider" viewBox="0 0 300 16" aria-hidden="true">
            <path d="M6 8 H132 M168 8 H294" stroke="url(#champ)" stroke-width="1" vector-effect="non-scaling-stroke"/>
            <path d="M150 2 L157 8 L150 14 L143 8 Z M136 8 c4 -5 8 -5 7 0 M164 8 c-4 -5 -8 -5 -7 0" fill="none" stroke="url(#champ)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- ================= GALLERY : 3D coverflow over a reflective pond ================= -->
    <section class="page gal" id="gal" aria-label="Gallery" aria-hidden="true">
      <div class="gal-bg" aria-hidden="true"></div>
      <div class="gal-bokeh" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <img class="flora gf-tl" src="../assets/img/en-fl-tl.png" alt="" aria-hidden="true">
      <img class="flora gf-bl" src="../assets/img/en-fl-bl.png" alt="" aria-hidden="true">
      <img class="flora gf-br" src="../assets/img/en-fl-br.png" alt="" aria-hidden="true">

      <button class="ic-back gal-back" type="button" id="galBack" aria-label="Back to the garden">
        <svg viewBox="0 0 48 24" aria-hidden="true"><path d="M46 12 H3 M12 3 L3 12 L12 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <header class="gal-head">
        <svg class="g-rings" viewBox="0 0 160 44" aria-hidden="true">
          <circle cx="70" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.4"/>
          <circle cx="90" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.4"/>
        </svg>
        <h2 class="gal-title">Gallery</h2>
        <p class="gal-names"><span id="galGroom"></span> <em>&amp;</em> <span id="galBride"></span></p>
      </header>

      <div class="flow" id="flow" aria-roledescription="carousel"></div>

      <button class="gal-nav prev" type="button" id="galPrev" aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="gal-nav next" type="button" id="galNext" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="gal-dots" id="galDots" role="tablist"></div>
      <p class="gal-count" id="galCount" aria-live="polite"></p>
    </section>

    <!-- ================= THE BIG DAY : ceremony aisle ================= -->
    <section class="page bd" id="bd" aria-label="The Big Day" aria-hidden="true">
      <div class="hero-backdrop" style="--bg:url('../assets/img/en-bd-tiny.jpg')" aria-hidden="true"></div>
      <div class="stage bd-stage">
        <div class="bd-world"><img class="bd-bg" src="../assets/img/en-bd-bg.jpg" alt="" draggable="false">
          <span class="bd-glow c1" aria-hidden="true"></span><span class="bd-glow c2" aria-hidden="true"></span>
          <span class="bd-glow c3" aria-hidden="true"></span><span class="bd-glow c4" aria-hidden="true"></span>
          <span class="bd-glow ch" aria-hidden="true"></span>
        </div>
        <div class="bd-shade" aria-hidden="true"></div>

        <button class="ic-back bd-back" type="button" id="bdBack" aria-label="Back to the garden">
          <svg viewBox="0 0 48 24" aria-hidden="true"><path d="M46 12 H3 M12 3 L3 12 L12 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <header class="bd-head">
          <svg class="g-rings" viewBox="0 0 160 44" aria-hidden="true">
            <circle cx="70" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.4"/>
            <circle cx="90" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.4"/>
          </svg>
          <h2 class="bd-title">The Big Day</h2>
          <p class="bd-names"><span id="bdGroom"></span> <em>&amp;</em> <span id="bdBride"></span></p>
          <svg class="bd-orn" viewBox="0 0 240 14" aria-hidden="true"><path d="M10 7 H104 M136 7 H230" stroke="url(#champ)" stroke-width="1" vector-effect="non-scaling-stroke"/><path d="M120 1 L127 7 L120 13 L113 7 Z" fill="none" stroke="url(#champ)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>
        </header>

        <!-- date + venue ticket -->
        <div class="bd-ticket" id="bdTicket">
          <span class="bd-leaf l1" aria-hidden="true"></span><span class="bd-leaf l2" aria-hidden="true"></span>
          <div class="bd-date">
            <span class="bd-dow" id="bdDow"></span>
            <span class="bd-mon" id="bdMon"></span>
            <span class="bd-day" id="bdDay"></span>
            <span class="bd-year" id="bdYear"></span>
          </div>
          <span class="bd-sep" aria-hidden="true"></span>
          <div class="bd-venue">
            <p class="bd-vname"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s-7-6.6-7-12a7 7 0 0 1 14 0c0 5.4-7 12-7 12z" fill="#c99a52"/><circle cx="12" cy="10" r="2.6" fill="#fff8ea"/></svg><span id="bdVenue"></span></p>
            <p class="bd-addr" id="bdAddr"></p>
            <a class="bd-map" id="bdMap" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
              <span>View Map</span>
            </a>
          </div>
        </div>

        <!-- timeline -->
        <div class="bd-tl">
          <p class="bd-tl-title"><span class="ln" aria-hidden="true"></span><em>Wedding Timeline</em><span class="ln r" aria-hidden="true"></span></p>
          <ol class="bd-steps" id="bdSteps"></ol>
        </div>
        <span class="bd-stage-light" aria-hidden="true"></span>
      </div>
    </section>

    <!-- ================= OUR STORY : the memory terrace ================= -->
    <section class="page st" id="st" aria-label="Our Story" aria-hidden="true">
      <div class="hero-backdrop" style="--bg:url('../assets/img/en-st-tiny.jpg')" aria-hidden="true"></div>
      <div class="stage st-stage">
        <div class="st-world">
          <img class="st-bg" src="../assets/img/en-st-bg.jpg" alt="" draggable="false">
          <div class="st-couple"><img src="../assets/img/en-st-couple.jpg" alt="Wai Hlyan Soe and Jue Mi Mi Aw"></div>
          <span class="st-sun" aria-hidden="true"></span>
          <span class="st-lamp" aria-hidden="true"></span>
          <img class="st-fl" src="../assets/img/en-fl-bl.png" alt="" aria-hidden="true">
        </div>
        <div class="st-shade" aria-hidden="true"></div>

        <button class="ic-back st-back" type="button" id="stBack" aria-label="Back to the garden">
          <svg viewBox="0 0 48 24" aria-hidden="true"><path d="M46 12 H3 M12 3 L3 12 L12 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <header class="st-head">
          <svg class="g-rings" viewBox="0 0 160 44" aria-hidden="true">
            <circle cx="70" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.4"/>
            <circle cx="90" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.4"/>
          </svg>
          <h2 class="st-title">Our Story</h2>
          <p class="st-names"><span id="stGroom"></span> <em>&amp;</em> <span id="stBride"></span></p>
          <svg class="bd-orn" viewBox="0 0 240 14" aria-hidden="true"><path d="M10 7 H104 M136 7 H230" stroke="url(#champ)" stroke-width="1" vector-effect="non-scaling-stroke"/><path d="M120 1 L127 7 L120 13 L113 7 Z" fill="none" stroke="url(#champ)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>
        </header>

        <div class="st-intro">
          <p class="st-sub" id="stSub"></p>
          <p class="st-lead" id="stLead"></p>
          <span class="st-heart" aria-hidden="true">♥</span>
        </div>

        <!-- glowing thread that ties the memories together -->
        <svg class="st-path" viewBox="0 0 1199 1312" preserveAspectRatio="none" aria-hidden="true">
          <path id="stThread" pathLength="1000" d="M707 571 C 960 600, 950 690, 760 716 C 560 740, 520 820, 625 840 C 760 870, 980 900, 900 960 C 830 1010, 720 1010, 636 1017 C 560 1030, 520 1100, 470 1130" fill="none" stroke="url(#champ)" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
          <circle r="4" fill="#fff6dc"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"><mpath href="#stThread"/></animateMotion></circle>
          <circle r="3" fill="#ffe7b0"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" calcMode="linear"><mpath href="#stThread"/></animateMotion></circle>
        </svg>

        <ol class="st-list" id="stList"></ol>
      </div>
    </section>

    <!-- ================= FUN QUIZ ================= -->
    <section class="page qz" id="qz" aria-label="Fun Quiz" aria-hidden="true">
      <div class="hero-backdrop" style="--bg:url('../assets/img/en-qz-tiny.jpg')" aria-hidden="true"></div>
      <div class="stage qz-stage">
        <div class="qz-world"><img class="qz-bg" src="../assets/img/en-qz-bg.jpg" alt="" draggable="false">
          <span class="bd-glow c1" aria-hidden="true"></span><span class="bd-glow c2" aria-hidden="true"></span>
        </div>
        <canvas class="qz-fx" id="qzFx" aria-hidden="true"></canvas>

        <button class="ic-back qz-back" type="button" id="qzBack" aria-label="Back to the garden">
          <svg viewBox="0 0 48 24" aria-hidden="true"><path d="M46 12 H3 M12 3 L3 12 L12 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <header class="qz-head">
          <svg class="g-rings" viewBox="0 0 160 44" aria-hidden="true"><circle cx="70" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.4"/><circle cx="90" cy="22" r="13" fill="none" stroke="url(#champ)" stroke-width="2.4"/></svg>
          <h2 class="qz-title" id="qzTitle">Fun Quiz</h2>
          <p class="qz-names"><span class="qzG"></span> <em>&amp;</em> <span class="qzB"></span></p>
          <svg class="bd-orn" viewBox="0 0 240 14" aria-hidden="true"><path d="M10 7 H104 M136 7 H230" stroke="url(#champ)" stroke-width="1" vector-effect="non-scaling-stroke"/><path d="M120 1 L127 7 L120 13 L113 7 Z" fill="none" stroke="url(#champ)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>
        </header>

        <div class="qz-prog" id="qzProg"><p id="qzStep"></p><div class="qz-dots" id="qzDots"></div></div>

        <!-- question card -->
        <div class="qz-card" id="qzCard">
          <div class="qz-photos" id="qzPhotos">
            <span class="qz-ph back2"></span><span class="qz-ph back1"></span>
            <span class="qz-ph front"><img id="qzImg" alt=""></span>
          </div>
          <span class="qz-q" id="qzNum">Q1</span>
          <div class="qz-ribbon"><p id="qzQuestion"></p></div>
          <div class="qz-opts" id="qzOpts"></div>
          <!-- step 0: who is playing -->
          <div class="qz-intro">
            <p class="qz-ask">Before we begin…</p>
            <label class="qz-lab" for="qzName">What’s your name?</label>
            <div class="qz-field"><input id="qzName" type="text" maxlength="40" autocomplete="name" placeholder="Type your name here"><span class="qz-field-glow" aria-hidden="true"></span></div>
          </div>
          <!-- last step: a few words from the heart -->
          <div class="qz-note">
            <p class="qz-ask">One last thing…</p>
            <label class="qz-lab" for="qzMsg">Leave us a few words from your heart ♡</label>
            <div class="qz-letter">
              <textarea id="qzMsg" maxlength="300" rows="4" placeholder="Write something sweet for the couple…"></textarea>
              <span class="qz-cnt" id="qzCnt">0 / 300</span>
            </div>
          </div>
          <div class="qz-nav">
            <button class="qz-btn ghost" type="button" id="qzPrev">← Back</button>
            <button class="qz-btn gold" type="button" id="qzNext" disabled>Next →</button>
          </div>
        </div>

        <!-- result card -->
        <div class="qz-res" id="qzRes" aria-live="polite">
          <span class="qz-res-photo"><img id="qzResImg" alt=""></span>
          <div class="qz-banner"><span>You got</span><b id="qzScore">0 / 5</b></div>
          <p class="qz-res-t" id="qzResT"></p>
          <p class="qz-res-s">Thank you for being part of our story. ♡</p>
          <p class="qz-hearts" aria-hidden="true">♡ ♡ ♡</p>
          <button class="qz-btn gold wide" type="button" id="qzAgain">Play Again ↻</button>
          <button class="qz-btn ghost wide" type="button" id="qzHome">Back to Invitation ⌂</button>
        </div>
      </div>
    </section>

    <!-- ================= THANK YOU ================= -->
    <section class="page ty" id="ty" aria-label="Thank you" aria-hidden="true">
      <div class="hero-backdrop" style="--bg:url('../assets/img/en-ty-tiny.jpg')" aria-hidden="true"></div>
      <div class="stage ty-stage">
        <div class="ty-world">
          <img class="ty-bg" src="../assets/img/en-ty-bg.jpg" alt="" draggable="false">
          <div class="ty-photo"><img src="../assets/img/gallery-en/g4.jpg" alt="Wai Hlyan Soe and Jue Mi Mi Aw"></div>
          <img class="ty-fl" src="../assets/img/en-fl-bl.png" alt="" aria-hidden="true">
          <span class="ty-glow" aria-hidden="true"></span>
        </div>
        <button class="ic-back ty-back" type="button" id="tyBack" aria-label="Back to the garden">
          <svg viewBox="0 0 48 24" aria-hidden="true"><path d="M46 12 H3 M12 3 L3 12 L12 21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="ty-text">
          <h2 class="ty-title">Thank You<svg class="ty-heart" viewBox="0 0 60 30" aria-hidden="true"><path d="M2 22 C20 28 34 20 40 14 M40 14 C38 8 44 4 48 8 C52 4 58 8 54 14 C52 18 48 20 48 22 C46 20 42 18 40 14Z" fill="none" stroke="url(#champ)" stroke-width="1.6"/></svg></h2>
          <p class="ty-l1" id="tyL1"></p>
          <svg class="ty-rings" viewBox="0 0 240 30" aria-hidden="true"><path d="M8 15 H92 M148 15 H232" stroke="#b68a45" stroke-width="1" vector-effect="non-scaling-stroke"/><circle cx="111" cy="15" r="11" fill="none" stroke="#c99a52" stroke-width="2"/><circle cx="129" cy="15" r="11" fill="none" stroke="#c99a52" stroke-width="2"/></svg>
          <p class="ty-l2" id="tyL2"></p>
          <p class="ty-l3" id="tyL3"></p>
          <p class="ty-end" aria-hidden="true"><span></span>♥<span></span></p>
        </div>
      </div>
    </section>

    <!-- full-screen photo viewer -->
    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo" aria-hidden="true">
      <img class="viewer-img" id="viewerImg" alt="">
      <button class="viewer-close" type="button" id="viewerClose" aria-label="Close">✕</button>
    </div>

    <!-- foreground leaves & blossoms that rush past the camera while walking -->
    <div class="walk" id="walk" aria-hidden="true">
      <img class="wk wk-l" src="../assets/img/en-fl-bl.png" alt="">
      <img class="wk wk-r" src="../assets/img/en-fl-br.png" alt="">
      <img class="wk wk-t" src="../assets/img/en-fl-tl.png" alt="">
      <span class="wk-bokeh"></span>
      <span class="wk-veil"></span>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="bgm" loop preload="auto"></audio>

  <script src="config.js?v=39"></script>
  <script src="app.js?v=39"></script>
</body>
</html>
