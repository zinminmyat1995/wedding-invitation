<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a1010">
  <title>我们的婚礼 · Wedding Invitation</title>
  <meta name="description" content="Wai Hlyan Soe & Jue Mi Mi Aw · 2026.11.29 · Royal Myeik Hotel">
  <meta property="og:title" content="我们的婚礼 · Wai Hlyan Soe & Jue Mi Mi Aw">
  <meta property="og:description" content="诚邀您共同见证我们的幸福时刻 · 2026.11.29">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&family=Cinzel:wght@500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="img/cn-bg.jpg">
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="cnGold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff4c8"/>
        <stop offset=".3" stop-color="#e9b24c"/>
        <stop offset=".55" stop-color="#a8701c"/>
        <stop offset=".8" stop-color="#f7d27a"/>
        <stop offset="1" stop-color="#b9822a"/>
      </linearGradient>
      <!-- auspicious cloud (xiangyun) -->
      <symbol id="xiangyun" viewBox="0 0 200 80">
        <path d="M18 62 C4 62 4 42 18 40 C16 26 34 20 44 30 C48 12 76 10 82 30 C92 20 112 24 110 40 C126 34 140 48 128 60 C150 58 170 44 160 30 C154 22 142 26 146 34 M128 60 L18 62" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M44 46 C44 38 54 38 54 45 C54 50 48 50 48 47 M82 44 C82 36 94 36 93 44 C92 49 86 49 86 46" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <!-- ================= PAGE 1 : opening (the artwork, brought to life) ================= -->
  <main class="page p1 on" id="p1" aria-label="我们的婚礼 · Wedding Invitation">
    <div class="backdrop" aria-hidden="true"></div>
    <div class="stage" id="st1">
      <img class="bg" src="img/cn-bg.jpg" alt="我们的婚礼 · Wai Hlyan Soe &amp; Jue Mi Mi Aw" draggable="false">
      <canvas class="sky" id="sky" aria-hidden="true"></canvas>
      <div class="art" id="art">
      <canvas class="layer" id="dragonBack" aria-hidden="true"></canvas>
      <div class="lay" data-k="front" aria-hidden="true"><img src="img/cn-front.png" alt=""></div>
      <div class="lay drg drgL" data-k="dragonL" aria-hidden="true"><img src="img/cn-dragonL.png" alt=""></div>
      <div class="lay drg drgR" data-k="dragonR" aria-hidden="true"><img src="img/cn-dragonR.png" alt=""></div>
      <i class="mist mistL" aria-hidden="true"></i><i class="mist mistR" aria-hidden="true"></i>
      <i class="glow eye eyeL" aria-hidden="true"></i><i class="glow eye eyeR" aria-hidden="true"></i>
      <i class="glow lan lanL" aria-hidden="true"></i><i class="glow lan lanR" aria-hidden="true"></i>
      <i class="glow xi" aria-hidden="true"></i>
      <div class="lay tas tasL" data-k="tasselL" aria-hidden="true"><img src="img/cn-tasselL.png" alt=""></div>
      <div class="lay tas tasR" data-k="tasselR" aria-hidden="true"><img src="img/cn-tasselR.png" alt=""></div>
      <div class="lay cl cl1" data-k="c1" aria-hidden="true"><img src="img/cn-c1.png" alt=""></div>
      <div class="lay cl cl6" data-k="c6" aria-hidden="true"><img src="img/cn-c6.png" alt=""></div>
      <div class="lay cl cl2" data-k="c2" aria-hidden="true"><img src="img/cn-c2.png" alt=""></div>
      <div class="lay cl cl3" data-k="c3" aria-hidden="true"><img src="img/cn-c3.png" alt=""></div>
      <div class="lay cl cl4" data-k="c4" aria-hidden="true"><img src="img/cn-c4.png" alt=""></div>
      <div class="lay cl cl5" data-k="c5" aria-hidden="true"><img src="img/cn-c5.png" alt=""></div>
      <canvas class="layer" id="petals" aria-hidden="true"></canvas>
      <i class="dim" aria-hidden="true"></i>
      <button class="enter" id="enterBtn" type="button" aria-label="进入邀请函"><i class="en-shine" aria-hidden="true"></i></button>
      </div>
    </div>
  </main>

  <!-- ================= PAGE 2 (temporary) ================= -->
  <main class="page p2" id="p2" aria-label="邀请函" aria-hidden="true">
    <div class="p2-bg" aria-hidden="true"></div>
    <canvas class="p2-dust" id="p2Dust" aria-hidden="true"></canvas>
    <div class="stage" id="st2">
      <div class="card">
        <i class="cn-corner tl"></i><i class="cn-corner tr"></i><i class="cn-corner bl"></i><i class="cn-corner br"></i>
        <p class="c-xi" aria-hidden="true">囍</p>
        <p class="c-names"><span id="c2Groom"></span><em>&amp;</em><span id="c2Bride"></span></p>
        <svg class="divider" viewBox="0 0 400 24" aria-hidden="true">
          <path d="M6 12 H160 M240 12 H394" stroke="url(#cnGold)" stroke-width="1.6"/>
          <use href="#xiangyun" x="165" y="-4" width="70" height="28" style="color:#f0c86a"/>
        </svg>
        <p class="c-kicker" id="c2Kicker"></p>
        <p class="c-date" id="c2Date"></p>
        <p class="c-week" id="c2Week"></p>
        <p class="c-time" id="c2Time"></p>
        <p class="c-venue" id="c2Venue"></p>
        <p class="c-city" id="c2City"></p>
        <p class="c-close" id="c2Close"></p>
      </div>
      <button class="back" id="backBtn" type="button" aria-label="返回">
        <span class="bk-orb" aria-hidden="true"><i class="bk-halo"></i><svg viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="bk-label" id="backLabel"></span>
      </button>
    </div>
    <p class="sig"><i class="sig-line" aria-hidden="true"></i><span class="sig-pre">love story crafted by</span><span class="sig-name">Zin Min Myat</span><i class="sig-line r" aria-hidden="true"></i></p>
  </main>

  <!-- the dragons fly over everything during the page change -->
  <canvas class="dragon-front" id="dragonFront" aria-hidden="true"></canvas>
  <link rel="preload" as="video" href="img/dragon.mp4">

  <audio id="bgm" loop preload="auto"></audio>

  <script src="config.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
