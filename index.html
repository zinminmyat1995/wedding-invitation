<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding Invitation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Myanmar:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #1d0606; --gold: #e3b04b; --ink: #f8ead0; --muted: #cdb48a; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 50% 30%, #4a1212, var(--bg)); color: var(--ink); font-family: "Noto Serif Myanmar", serif; text-align: center; }
    h1 { font-family: "Great Vibes", cursive; font-weight: 400; font-size: clamp(40px, 12vw, 64px); color: var(--gold); line-height: 1.2; }
    p { color: var(--muted); margin: 6px 0 26px; }
    .list { display: grid; gap: 14px; width: min(100%, 360px); margin: 0 auto; }
    a, span.soon { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 18px; border: 1px solid rgba(227,176,75,.4); background: rgba(255,255,255,.04); color: var(--ink); text-decoration: none; font-weight: 700; transition: transform .2s, background .2s; }
    a:hover { transform: translateY(-3px); background: rgba(227,176,75,.12); }
    .flag { font-size: 28px; }
    .soon { opacity: .45; }
    small { margin-left: auto; font-weight: 400; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Wedding Invitation</h1>
    <p>ဖိတ်စာ ဗားရှင်း ရွေးပါ</p>
    <div class="list">
      <a href="mm/"><span class="flag">🇲🇲</span> မြန်မာ <small>Golden Palace</small></a>
      <a href="en/"><span class="flag">🇬🇧</span> English <small>Garden Romance</small></a>
      <a href="chinese/"><span class="flag">🇨🇳</span> 中文 <small>Dragon &amp; Clouds</small></a>
    </div>
  </main>
</body>
</html>
